<!DOCTYPE html>
<html>
<head>
    <!-- Tus etiquetas Meta corregidas con las rutas completas hacia tu repositorio -->

    <meta property="og:description" content="Haz clic aquí para entrar al sitio web">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.io">
    <meta property="og:image" content="https://smr2armaj-cell.github.io/laboratorio-hack/foto.jpg">

    <!-- Esto garantiza que la previsualización se cargue a pantalla completa en WhatsApp -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Acceder al Laboratorio Educativo">
    <meta name="twitter:description" content="Haz clic aquí para entrar al sitio web">
    <meta name="twitter:image" content="https://smr2armaj-cell.github.io/laboratorio-hack/foto.jpg">

   
    
    <title></title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{height:100vh;background:#0a0a0a;display:flex;justify-content:center;align-items:center;font-family:'Courier New',monospace;overflow:hidden}
        #foto{max-width:100%;max-height:100%;object-fit:contain}
        #overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:none;justify-content:center;align-items:center;z-index:9999}
        #mensaje{background:#1a1a1a;padding:40px;border-radius:15px;border:3px solid #ff0044;max-width:85%;text-align:center;box-shadow:0 0 80px rgba(255,0,68,0.6);animation:aparecer .8s ease-out}
        @keyframes aparecer{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
        @keyframes carga{0%{width:0}100%{width:100%}}
        .titulo{font-size:2.2em;font-weight:bold;color:#ff0044;text-shadow:0 0 30px #ff0044}
        .cve{font-size:1.6em;color:#ffaa00;margin:10px 0}
        .verde{font-size:1.2em;color:#00ff41;margin:15px 0}
        .info{font-size:.8em;color:#666;margin-top:20px;border-top:1px solid #333;padding-top:15px}
        .barra{width:80%;height:8px;background:#333;border-radius:4px;margin:15px auto;overflow:hidden}
        .progreso{height:100%;width:0;background:#00ff41;animation:carga 2s forwards}
    </style>
</head>
<body>
    <img id="foto" src="foto.jpg" alt="Imagen del laboratorio">
    <div id="overlay">
        <div id="mensaje">
            <div style="font-size:3em">💀</div>
            <div class="titulo">EXPLOIT DETECTADO</div>
            <div class="cve">CVE-2025-21042</div>
            <div class="verde">🔓 Ejecucion remota de codigo</div>
            <div class="barra"><div class="progreso"></div></div>
            <div style="font-size:1em;color:#00ff41">✅ Payload inyectado con exito</div>
            <div class="info">⚠️ LABORATORIO EDUCATIVO - Simulacion controlada<br><span style="color:#444">La imagen sigue visible bajo este mensaje</span></div>
        </div>
    </div>
    <script>
        window.onload=function(){setTimeout(function(){document.getElementById('overlay').style.display='flex'},2e3)}
    </script>
</body>
</html>
